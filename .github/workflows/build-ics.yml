name: Build calendar files

on:
  push:
    branches: [main]
    paths: [data.json, scripts/build-ics.mjs]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ics
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-ics.mjs
      - name: Commit updated calendar files
        run: |
          git add -A cal
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update calendar files from data.json"
          git push
